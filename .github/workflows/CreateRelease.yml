name: CreateRelease

on:
  #[push, pull_request] #just for test release scripts
  workflow_dispatch: #manual run
    inputs:
      version:
        description: 'MeshLab Version'
        required: true
        default: 'YYYY.MM'

env:
  QT_VERSION: 5.15.2
  MAC_CERT: ${{secrets.MACOS_CERT_ID}}
  WIN_CERT: ${{secrets.WIN_CERTIFICATE}}

jobs:
  meshlab_plugins_build:
    name: Build MeshLab Extra Plugins
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['ubuntu-22.04', 'ubuntu-22.04-arm', 'macos-15-intel', 'macos-latest', 'windows-latest']
        precision: [single_precision, double_precision]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Setup Environment
      uses: ./meshlab/.github/actions/0_setup
      with:
        qt-version: ${{env.QT_VERSION}}
        use-jurpel-qt-action: ${{matrix.os != 'macos-latest' && matrix.os != 'ubuntu-22.04-arm'}}
    - name: Setup env variables
      id: envs
      shell: bash
      run: |
        ARCH=$(uname -m)
        if [ "${{matrix.precision}}" == "double_precision" ]; then
          echo "artifact_suffix=_double_$ARCH" >> $GITHUB_OUTPUT
        else
          echo "artifact_suffix=_$ARCH" >> $GITHUB_OUTPUT
        fi
        if [ "${{matrix.os}}" == "macos-latest" ]; then
          echo "build_options=--use_brew_qt" >> $GITHUB_OUTPUT
        else
          echo "build_options=" >> $GITHUB_OUTPUT
        fi
    - name: Configure and Build
      shell: bash
      run: |
        bash scripts/${{ runner.os }}/1_build.sh --${{ matrix.precision }} ${{steps.envs.outputs.build_options}}
    - name: Sign
      uses: cnr-isti-vclab/sign-and-notarize@v1
      with:
        input-path: 'install/meshlab/plugins/*'
        macos-certificate: '${{ secrets.MACOS_CERTIFICATE }}'
        macos-certificate-id: '${{ secrets.MACOS_CERT_ID }}'
        macos-certificate-password: '${{ secrets.MACOS_CERTIFICATE_PSSW }}'
    - name: Upload MeshLab Extra Plugins
      uses: actions/upload-artifact@v4
      with:
        name: MeshLab_${{ runner.os }}_extra_plugins${{steps.envs.outputs.artifact_suffix}}
        path: install/meshlab/plugins


  #after building MeshLab for the three platforms, we create a release in github
  create_release:
    name: Create Release
    needs: [meshlab_plugins_build]
    runs-on: ubuntu-latest
    steps:

    #Download Linux Packages
    - name: Download Linux ZIP x86_64
      uses: actions/download-artifact@v4
      with:
        name: MeshLab_Linux_extra_plugins_x86_64
        path: MeshLab_Linux_extra_plugins_x86_64
    - name: Download Linux ZIP double x86_64
      uses: actions/download-artifact@v4
      with:
        name: MeshLab_Linux_extra_plugins_double_x86_64
        path: MeshLab_Linux_extra_plugins_double_x86_64
    - name: Create Linux x86_64 Archive
      run: |
        mv MeshLab_Linux_extra_plugins_x86_64 MeshLab-Extra-Plugins-${{ github.event.inputs.version }}-linux_x86_64
        tar -cvzf MeshLab-Extra-Plugins-${{ github.event.inputs.version }}-linux_x86_64.tar.gz MeshLab-Extra-Plugins-${{ github.event.inputs.version }}-linux_x86_64/
        mv MeshLab_Linux_extra_plugins_double_x86_64 MeshLab-Extra-Plugins-${{ github.event.inputs.version }}d-linux_x86_64
        tar -cvzf MeshLab-Extra-Plugins-${{ github.event.inputs.version }}d-linux_x86_64.tar.gz MeshLab-Extra-Plugins-${{ github.event.inputs.version }}d-linux_x86_64/

    - name: Download Linux ZIP aarch64
      uses: actions/download-artifact@v4
      with:
        name: MeshLab_Linux_extra_plugins_aarch64
        path: MeshLab_Linux_extra_plugins_aarch64
    - name: Download Linux ZIP double aarch64
      uses: actions/download-artifact@v4
      with:
        name: MeshLab_Linux_extra_plugins_double_aarch64
        path: MeshLab_Linux_extra_plugins_double_aarch64
    - name: Create Linux aarch64 Archive
      run: |
        mv MeshLab_Linux_extra_plugins_aarch64 MeshLab-Extra-Plugins-${{ github.event.inputs.version }}-linux_aarch64
        tar -cvzf MeshLab-Extra-Plugins-${{ github.event.inputs.version }}-linux_aarch64.tar.gz MeshLab-Extra-Plugins-${{ github.event.inputs.version }}-linux_aarch64/
        mv MeshLab_Linux_extra_plugins_double_aarch64 MeshLab-Extra-Plugins-${{ github.event.inputs.version }}d-linux_aarch64
        tar -cvzf MeshLab-Extra-Plugins-${{ github.event.inputs.version }}d-linux_aarch64.tar.gz MeshLab-Extra-Plugins-${{ github.event.inputs.version }}d-linux_aarch64/

    #Download MacOS Packages
    - name: Download MacOS ZIP x86_64
      uses: actions/download-artifact@v4
      with:
        name: MeshLab_macOS_extra_plugins_x86_64
        path: MeshLab_macOS_extra_plugins_x86_64
    - name: Download MacOS ZIP double
      uses: actions/download-artifact@v4
      with:
        name: MeshLab_macOS_extra_plugins_double_x86_64
        path: MeshLab_macOS_extra_plugins_double_x86_64
    - name: Create MacOS Archive
      run: |
        mv MeshLab_macOS_extra_plugins_x86_64 MeshLab-Extra-Plugins-${{ github.event.inputs.version }}-macos_x86_64
        zip -r MeshLab-Extra-Plugins-${{ github.event.inputs.version }}-macos_x86_64.zip MeshLab-Extra-Plugins-${{ github.event.inputs.version }}-macos_x86_64/
        mv MeshLab_macOS_extra_plugins_double_x86_64 MeshLab-Extra-Plugins-${{ github.event.inputs.version }}d-macos_x86_64
        zip -r MeshLab-Extra-Plugins-${{ github.event.inputs.version }}d-macos_x86_64.zip MeshLab-Extra-Plugins-${{ github.event.inputs.version }}d-macos_x86_64/

    - name: Download MacOS ZIP arm64
      uses: actions/download-artifact@v4
      with:
        name: MeshLab_macOS_extra_plugins_arm64
        path: MeshLab_macOS_extra_plugins_arm64
    - name: Download MacOS ZIP double
      uses: actions/download-artifact@v4
      with:
        name: MeshLab_macOS_extra_plugins_double_arm64
        path: MeshLab_macOS_extra_plugins_double_arm64
    - name: Create MacOS Archive
      run: |
        mv MeshLab_macOS_extra_plugins_arm64 MeshLab-Extra-Plugins-${{ github.event.inputs.version }}-macos_arm64
        zip -r MeshLab-Extra-Plugins-${{ github.event.inputs.version }}-macos_arm64.zip MeshLab-Extra-Plugins-${{ github.event.inputs.version }}-macos_arm64/
        mv MeshLab_macOS_extra_plugins_double_arm64 MeshLab-Extra-Plugins-${{ github.event.inputs.version }}d-macos_arm64
        zip -r MeshLab-Extra-Plugins-${{ github.event.inputs.version }}d-macos_arm64.zip MeshLab-Extra-Plugins-${{ github.event.inputs.version }}d-macos_arm64/

    #Download Windows Packages
    - name: Download Windows ZIP x86_64
      uses: actions/download-artifact@v4
      with:
        name: MeshLab_Windows_extra_plugins_x86_64
        path: MeshLab_Windows_extra_plugins_x86_64
    - name: Download Windows ZIP double
      uses: actions/download-artifact@v4
      with:
        name: MeshLab_Windows_extra_plugins_double_x86_64
        path: MeshLab_Windows_extra_plugins_double_x86_64
    - name: Create Windows Archive
      run: |
        mv MeshLab_Windows_extra_plugins_x86_64 MeshLab-Extra-Plugins-${{ github.event.inputs.version }}-windows_x86_64
        zip -r MeshLab-Extra-Plugins-${{ github.event.inputs.version }}-windows_x86_64.zip MeshLab-Extra-Plugins-${{ github.event.inputs.version }}-windows_x86_64/
        mv MeshLab_Windows_extra_plugins_double_x86_64 MeshLab-Extra-Plugins-${{ github.event.inputs.version }}d-windows_x86_64
        zip -r MeshLab-Extra-Plugins-${{ github.event.inputs.version }}d-windows_x86_64.zip MeshLab-Extra-Plugins-${{ github.event.inputs.version }}d-windows_x86_64/

    #Create release and upload
    - uses: "ncipollo/release-action@v1"
      with:
        token: "${{ secrets.GITHUB_TOKEN }}"
        tag: "Meshlab-Extra-Plugins-${{ github.event.inputs.version }}"
        name: "Meshlab-Extra-Plugins-${{ github.event.inputs.version }}"
        body: "Note about the ${{ github.event.inputs.version }}d version: these releases are built with double precision floating point numbers."
        draft: true
        artifacts: |
          MeshLab-Extra-Plugins-${{ github.event.inputs.version }}-linux_x86_64.tar.gz
          MeshLab-Extra-Plugins-${{ github.event.inputs.version }}d-linux_x86_64.tar.gz
          MeshLab-Extra-Plugins-${{ github.event.inputs.version }}-linux_aarch64.tar.gz
          MeshLab-Extra-Plugins-${{ github.event.inputs.version }}d-linux_aarch64.tar.gz
          MeshLab-Extra-Plugins-${{ github.event.inputs.version }}-macos_x86_64.zip
          MeshLab-Extra-Plugins-${{ github.event.inputs.version }}d-macos_x86_64.zip
          MeshLab-Extra-Plugins-${{ github.event.inputs.version }}-macos_arm64.zip
          MeshLab-Extra-Plugins-${{ github.event.inputs.version }}d-macos_arm64.zip
          MeshLab-Extra-Plugins-${{ github.event.inputs.version }}-windows_x86_64.zip
          MeshLab-Extra-Plugins-${{ github.event.inputs.version }}d-windows_x86_64.zip
