name: BuildMeshLabPlugins

on:
  [push, pull_request]

env:
  QT_VERSION: 5.15.2

jobs:
  meshlab_plugins_build:
    name: Build MeshLab Extra Plugins
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-22.04', 'ubuntu-22.04-arm', 'macos-15-intel', 'macos-latest', 'windows-latest']
        precision: [single_precision, double_precision]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Setup Environment
      uses: ./meshlab/.github/actions/0_setup
      with:
        qt-version: ${{env.QT_VERSION}}
        use-jurpel-qt-action: ${{matrix.os != 'macos-latest' && matrix.os != 'ubuntu-22.04-arm'}}
    - name: Setup env variables
      id: envs
      shell: bash
      run: |
        ARCH=$(uname -m)
        if [ "${{matrix.precision}}" == "double_precision" ]; then
          echo "artifact_suffix=_double_$ARCH" >> $GITHUB_OUTPUT
        else
          echo "artifact_suffix=_$ARCH" >> $GITHUB_OUTPUT
        fi
        if [ "${{matrix.os}}" == "macos-latest" ]; then
          echo "build_options=--use_brew_qt" >> $GITHUB_OUTPUT
        else
          echo "build_options=" >> $GITHUB_OUTPUT
        fi
    - name: Ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-${{ github.ref }}-${{ matrix.precision }}
    - name: Configure and Build
      shell: bash
      run: |
        bash scripts/${{ runner.os }}/1_build.sh --${{ matrix.precision }} --nightly --ccache ${{steps.envs.outputs.build_options}}
    - name: Upload MeshLab Extra Plugins
      uses: actions/upload-artifact@v4
      with:
        name: MeshLab_${{ runner.os }}_extra_plugins${{steps.envs.outputs.artifact_suffix}}
        path: install/meshlab/plugins
